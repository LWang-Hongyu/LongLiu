# E11: Overlap 敏感性实验
# 验证 LongLiu 基于串行模型推导的带宽分配在不同重叠率下的鲁棒性
name: "e11_overlap_sensitivity"
topology:
  type: "fatree"
  k: 4
  host_bw_bps: 100000000000.0  # 100 Gbps
  tor_bw_bps: 100000000000.0
  spine_bw_bps: 500000000000.0  # 默认 500 Gbps（实验脚本会覆盖）
duration_ms: 600000  # 10 分钟

policies: ["Fair", "CRUX", "SP", "D1", "v4"]
seeds: [0, 1, 2, 3, 4]

# 过渡区带宽点（Gbps）— P-attn 对 overlap 最敏感
spine_bw_gbps: [500, 630]

# 重叠率扫描点（0=完全串行, 1=完全重叠, 0.85=冻结值）
overlap_factors: [0.0, 0.3, 0.5, 0.85, 1.0]

premium_ci_threshold: 2.0  # ci <= 2.0 → premium
